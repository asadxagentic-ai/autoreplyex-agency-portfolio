<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald / Mint Teal Gradient for X -->
    <linearGradient id="x-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00845A" />
      <stop offset="35%" stop-color="#00B873" />
      <stop offset="70%" stop-color="#00D287" />
      <stop offset="100%" stop-color="#00E599" />
    </linearGradient>

    <!-- Deep Navy Slate for A -->
    <linearGradient id="a-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222C3C" />
      <stop offset="100%" stop-color="#18212F" />
    </linearGradient>

    <!-- Crisp clean drop shadow for the speech bubble -->
    <filter id="chat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#FFFFFF" />

  <g transform="translate(6, 0)">
    <!-- NAVY LETTER 'A' -->
    <!-- Outer silhouette of A with apex and left leg down to base -->
    <path
      d="M 104 340 L 218 150 C 223 142 231 138 240 138 L 268 138 C 277 138 285 142 290 150 L 316 194 C 298 206 284 224 280 246 C 268 250 258 258 252 268 L 222 340 L 104 340 Z"
      fill="url(#a-gradient)"
    />

    <!-- Inner Triangular Counter of A -->
    <path
      d="M 230 220 L 254 176 C 255 174 257 174 258 176 L 278 214 C 268 218 256 220 244 220 C 239 220 234 220 230 220 Z"
      fill="#FFFFFF"
    />

    <!-- THE EMERALD 'X' RIBBON -->
    <!-- Upper right arm -->
    <path
      d="M 352 184 L 406 184 C 411 184 414 189 411 193 L 348 284 C 342 293 338 303 338 312 C 338 322 344 328 354 328 L 382 328 L 375 340 C 371 346 364 350 357 350 L 324 350 C 304 350 290 336 290 316 C 290 300 298 284 312 264 L 350 208 L 332 208 L 344 188 C 346 185 349 184 352 184 Z"
      fill="url(#x-gradient)"
    />

    <!-- Lower swoosh of X under bubble connecting to base -->
    <path
      d="M 222 340 C 240 340 268 335 292 320 C 290 316 288 312 288 307 C 288 299 292 292 298 286 C 280 300 256 312 232 318 L 222 340 Z"
      fill="#009660"
    />

    <!-- WHITE CHAT BUBBLE -->
    <g filter="url(#chat-shadow)">
      <path
        d="M 194 266 C 194 240 216 220 248 220 C 280 220 302 240 302 266 C 302 292 280 312 248 312 C 236 312 225 308 216 302 L 194 310 L 201 289 C 197 282 194 274 194 266 Z"
        fill="#FFFFFF"
      />
      <!-- 3 MINT/TEAL CHAT DOTS -->
      <circle cx="226" cy="266" r="6" fill="#00D287" />
      <circle cx="248" cy="266" r="6" fill="#00D287" />
      <circle cx="270" cy="266" r="6" fill="#00D287" />
    </g>
  </g>
</svg>
